services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: &default-logging
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - sjtu_contest_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      - ./backend/logs:/app/logs
      - resource_media:/app/media
      - static_files:/app/staticfiles
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/users/jaccount/auth/url/', timeout=5)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    networks:
      - sjtu_contest_net

  backend-cron:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      TZ: Asia/Shanghai
    volumes:
      - ./backend/logs:/app/logs
    entrypoint: ["/app/cron-entrypoint.sh"]
    logging: *default-logging
    networks:
      - sjtu_contest_net

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - static_files:/usr/share/nginx/django-static:ro
    logging: *default-logging
    networks:
      - sjtu_contest_net

volumes:
  postgres_data:
  resource_media:
  static_files:

networks:
  sjtu_contest_net:
    driver: bridge
